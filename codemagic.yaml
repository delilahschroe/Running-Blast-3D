workflows:
  unity-ios:
    name: Unity iOS Build & Upload to App Store

    environment:
      vars:
        UNITY_VERSION: "6000.0.59f2"   # Unity version to install

    scripts:
      - name: Build iOS with Unity
        script: |
          #!/usr/bin/env bash
          set -e

          # Full path to Unity executable on Codemagic
          UNITY_PATH="/Applications/Unity/Hub/Editor/6000.0.59f2/Unity.app/Contents/MacOS/Unity"

          # Build Unity iOS project
          $UNITY_PATH \
            -batchmode \
            -nographics \
            -quit \
            -projectPath . \
            -executeMethod Build.iOS \
            -logFile /dev/stdout

      - name: Install CocoaPods
        script: |
          cd build/iOS
          pod install || true

    artifacts:
      - build/iOS/**/*.ipa
      - build/iOS/**/*.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $KEY_ID
        issuer_id: $ISSUER_ID
        submit_to_app_store: true
