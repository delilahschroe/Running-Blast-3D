workflows:
  unity-ios:
    name: Unity iOS Build & Upload to App Store

    environment:
      unity: "2022.3.62f2"    # Supported Unity 2022 LTS version

    scripts:
      - name: Activate Unity License
        script: |
          #!/usr/bin/env bash
          set -e
          echo "Activating Unity license..."
          "$UNITY_HOME/Contents/MacOS/Unity" \
            -batchmode \
            -nographics \
            -quit \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" \
            -serial "$UNITY_SERIAL" \
            -logFile "$CM_BUILD_DIR/unity_license.log"
          cat "$CM_BUILD_DIR/unity_license.log"

      - name: Build iOS with Unity
        script: |
          #!/usr/bin/env bash
          set -e
          LOG_FILE="$CM_BUILD_DIR/unity_build.log"
          mkdir -p build/iOS
          echo "Building Unity iOS project..."
          "$UNITY_HOME/Contents/MacOS/Unity" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath . \
            -executeMethod Build.iOS \
            -logFile "$LOG_FILE"
          cat "$LOG_FILE"

      - name: Install CocoaPods
        script: |
          cd build/iOS
          pod install || true

    artifacts:
      - build/iOS/**/*.ipa
      - build/iOS/**/*.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $KEY_ID
        issuer_id: $ISSUER_ID
        submit_to_app_store: true
