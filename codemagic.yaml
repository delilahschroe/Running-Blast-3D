workflows:
  unity-ios:
    name: Unity iOS Build & Upload to App Store

    scripts:
      - name: Build iOS with Unity
        script: |
          unity-editor \
            -batchmode \
            -quit \
            -projectPath . \
            -executeMethod Build.iOS

      - name: Install CocoaPods
        script: |
          cd build/iOS
          pod install || true

    artifacts:
      - build/iOS/**/*.ipa
      - build/iOS/**/*.xcarchive

    publishing:
      app_store_connect:
        # Use App Store Connect API key stored as environment variables
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $KEY_ID
        issuer_id: $ISSUER_ID
        submit_to_app_store: true
