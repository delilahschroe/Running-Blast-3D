workflows:
  unity-ios:
    name: Unity iOS Build
    environment:
      groups:
        - unity_credentials
        - app_store_connect
      vars:
        UNITY_VERSION: "6000.0.59f2"
        BUNDLE_ID: "com.cleanfun.aquablastmaster"

    scripts:
      - name: Check Unity version
        script: |
          if command -v unity-editor >/dev/null 2>&1; then
            unity-editor -version
          else
            echo "Unity not installed."
            exit 1
          fi

      - name: Activate Unity license
        script: |
          unity-editor \
            -batchmode \
            -quit \
            -serial "$UNITY_SERIAL" \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD"

      - name: Build iOS with Unity
        script: |
          unity-editor \
            -batchmode \
            -quit \
            -projectPath . \
            -executeMethod Build.iOS

      - name: Install CocoaPods
        script: |
          cd build/iOS
          pod install || true

    code_signing:
      xcode:
        app_store_connect:
          api_key: $APP_STORE_CONNECT_PRIVATE_KEY
          key_id: $KEY_ID
          issuer_id: $ISSUER_ID

    artifacts:
      - build/iOS/ipa/*.ipa
      - build/iOS/Unity-iPhone.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $KEY_ID
        issuer_id: $ISSUER_ID
        submit_to_testflight: true
