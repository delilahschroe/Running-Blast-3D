workflows:
  unity-ios:
    name: Unity iOS Build

    environment:
      unity: "2022.3.62f2"  # Use a valid Unity version from Codemagic docs

    scripts:
      - name: Print version info
        script: |
          echo "UNITY_HOME is $UNITY_HOME"
          ls -l "$UNITY_HOME"

      - name: Build iOS with Unity
        script: |
          #!/usr/bin/env bash
          set -e
          "$UNITY_HOME/Contents/MacOS/Unity" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath . \
            -executeMethod Build.iOS \
            -logFile /dev/stdout

      - name: Install CocoaPods
        script: |
          cd build/iOS
          pod install || true

    artifacts:
      - build/iOS/**/*.ipa
      - build/iOS/**/*.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $KEY_ID
        issuer_id: $ISSUER_ID
        submit_to_app_store: true
