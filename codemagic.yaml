workflows:
  unity-ios:
    name: Unity iOS Build & Upload to App Store

    scripts:
      - name: Build iOS with Unity
        script: |
          unity-editor \
            -batchmode \
            -quit \
            -projectPath . \
            -executeMethod Build.iOS

      - name: Install CocoaPods
        script: |
          cd build/iOS
          pod install || true

    artifacts:
      - build/iOS/**/*.ipa
      - build/iOS/**/*.xcarchive

    publishing:
      app_store_connect:
        submit_to_app_store: true
