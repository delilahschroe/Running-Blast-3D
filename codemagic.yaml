workflows:
  unity-ios:
    name: Unity iOS Build
    environment:
      groups:
        - unity_credentials        # UNITY_EMAIL, UNITY_PASSWORD, UNITY_SERIAL
        - app_store_connect        # APP_STORE_CONNECT_PRIVATE_KEY, ISSUER_ID, KEY_ID
      vars:
        UNITY_VERSION: "6000.0.59f2"     # Your Unity version
        BUNDLE_ID: "com.cleanfun.aquablastmaster"

    scripts:
      - name: Check Unity version
        script: |
          echo "Checking installed Unity version..."
          if command -v unity-editor >/dev/null 2>&1; then
            unity-editor -version
          else
            echo "ERROR: Unity is not installed on this build machine."
            exit 1
          fi

      - name: Activate Unity license
        script: |
          unity-editor \
            -batchmode \
            -nographics \
            -quit \
            -logFile /dev/stdout \
            -serial "$UNITY_SERIAL" \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD"

      - name: Build iOS project with Unity
        script: |
          unity-editor \
            -batchmode \
            -nographics \
            -quit \
            -logFile /dev/stdout \
            -projectPath . \
            -executeMethod Build.iOS

      - name: Install Cocoapods
        script: |
          cd build/iOS
          pod install || true

    ios_signing:
      app_store_connect:
        api_key: |
          $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $KEY_ID
        issuer_id: $ISSUER_ID
        bundle_identifier: $BUNDLE_ID
        provisioning_profiles:
          - name: ios_profile
            bundle_identifier: $BUNDLE_ID

    artifacts:
      - build/iOS/ipa/*.ipa
      - build/iOS/Unity-iPhone.xcarchive

    publishing:
      app_store_connect:
        api_key: |
          $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $KEY_ID
        issuer_id: $ISSUER_ID
        submit_to_testflight: true
