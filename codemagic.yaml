workflows:
  unity-ios:
    name: Unity iOS Build & Upload to App Store

    environment:
      unity: "2022.3.62f2"   # Supported LTS Unity version on Codemagic

    scripts:
      - name: Build iOS with Unity
        script: |
          #!/usr/bin/env bash
          set -e

          # Unity log file
          LOG_FILE="$CM_BUILD_DIR/unity_build.log"
          echo "Building Unity iOS project..."

          # Build Unity project
          "$UNITY_HOME/Contents/MacOS/Unity" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath . \
            -executeMethod Build.iOS \
            -logFile "$LOG_FILE"

          # Output Unity logs to console
          cat "$LOG_FILE"

      - name: Install CocoaPods
        script: |
          cd build/iOS
          pod install || true

    artifacts:
      - build/iOS/**/*.ipa
      - build/iOS/**/*.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $KEY_ID
        issuer_id: $ISSUER_ID
        submit_to_app_store: true
