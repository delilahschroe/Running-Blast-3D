workflows:
  unity-ios:
    name: Unity iOS Build
    environment:
      groups:
        - unity_credentials
      vars:
        UNITY_VERSION: "6000.0.59f2"

    scripts:
      - name: Check Unity version
        script: |
          unity-editor -version || exit 1

      - name: Activate Unity license
        script: |
          unity-editor \
            -batchmode \
            -quit \
            -serial "$UNITY_SERIAL" \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD"

      - name: Build iOS with Unity
        script: |
          unity-editor \
            -batchmode \
            -quit \
            -projectPath . \
            -executeMethod Build.iOS

      - name: Install CocoaPods
        script: |
          cd build/iOS
          pod install || true

    artifacts:
      - build/iOS/**/*.ipa
      - build/iOS/**/*.xcarchive
